<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blockbuster ticket-blue rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0a3aa8"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffd23f" stroke-width="20"/>
  <!-- camera body -->
  <rect x="96" y="176" width="320" height="220" rx="36" fill="#ffd23f"/>
  <!-- viewfinder hump -->
  <path d="M196 176 L216 132 Q220 124 230 124 L282 124 Q292 124 296 132 L316 176 Z" fill="#ffd23f"/>
  <!-- flash -->
  <rect x="348" y="140" width="48" height="28" rx="8" fill="#ffd23f"/>
  <!-- lens -->
  <circle cx="256" cy="286" r="86" fill="#0a3aa8"/>
  <circle cx="256" cy="286" r="62" fill="#4cd7ff"/>
  <circle cx="256" cy="286" r="62" fill="none" stroke="#0a3aa8" stroke-width="6"/>
  <circle cx="232" cy="262" r="18" fill="#ffffff" opacity="0.85"/>
  <!-- shutter dot -->
  <circle cx="136" cy="216" r="14" fill="#ff5d6c"/>
</svg>
